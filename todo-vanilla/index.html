<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-wrapper">

    <!-- 앱 헤더 -->
    <header class="app-header">
      <div class="header-accent"></div>
      <h1 class="app-title">Todo<span class="title-dot">.</span></h1>
      <p class="todo-count">
        <span id="completedCount">0</span> / <span id="totalCount">0</span> 완료
      </p>
    </header>

    <!-- 주간 뷰 (신규 추가) -->
    <div class="week-navigator">
      <div class="week-header">
        <button id="prevWeekBtn" class="week-nav-btn" title="이전 주">&#8249;</button>
        <span id="weekRangeLabel" class="week-range-label"></span>
        <button id="nextWeekBtn" class="week-nav-btn" title="다음 주">&#8250;</button>
      </div>
      <!-- 월~일 날짜 셀 7개 (app.js에서 동적으로 생성) -->
      <div id="weekDays" class="week-days"></div>
    </div>

    <!-- 일간 날짜 네비게이터 -->
    <div class="date-navigator">
      <button id="prevDateBtn" class="date-nav-btn" title="이전 날짜">&#8249;</button>
      <div class="date-display">
        <span id="dateLabel" class="date-label"></span>
        <span id="todayBadge" class="today-badge hidden">오늘</span>
      </div>
      <button id="nextDateBtn" class="date-nav-btn" title="다음 날짜">&#8250;</button>
    </div>

    <!-- 입력 영역 -->
    <section class="input-section">
      <div class="input-group">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="새로운 할 일을 입력하세요"
          maxlength="100"
          autocomplete="off"
        />
        <button id="addButton" class="add-button" aria-label="Todo 추가">
          <span class="add-icon">+</span>
        </button>
      </div>
      <p id="errorMessage" class="error-message hidden">할 일을 입력해 주세요.</p>
    </section>

    <!-- 필터 탭 영역 -->
    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">전체</button>
      <button class="filter-tab" data-filter="active">진행 중</button>
      <button class="filter-tab" data-filter="completed">완료</button>
    </div>

    <!-- Todo 목록 영역 -->
    <section class="list-section">
      <div id="emptyState" class="empty-state">
        <span class="empty-icon">✦</span>
        <p id="emptyMessage">아직 할 일이 없어요.<br />새로운 Todo를 추가해 보세요.</p>
      </div>
      <ul id="todoList" class="todo-list"></ul>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
